[project]
name = "bimanual-dg5fs"
version = "0.1.0"
description = "Bimanual UR5e + Tesollo DG-5F-S Twin of Nando's setup: Scene for teleoperation and training"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Versions match simtoolreal_newton's Isaac Lab venv, so Limbs behave the same in both.
    "mujoco==3.12.0",
    "newton==1.6.0rc1",
    "mujoco-warp==3.12.0",
    "warp-lang==1.17.0",
    "mink",
    "numpy",
    "scipy",
    "trimesh",
    "pycollada",
    "pillow",
    "pyzmq",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bimanual_dg5fs"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
