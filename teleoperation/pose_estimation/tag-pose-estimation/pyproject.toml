[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[project]
name = "tag-pose-estimation"
version = "0.2.0"
description = "Fiduciary tag based pose estimation toolbox. Provides everything necessary to setup and run tag based pose estimation on a robot platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cma==4.0.0",
    "gtsam==4.2a7",
    "numpy<2",
    "matplotlib==3.10.1",
    "opencv-contrib-python==4.11.0.86",
    "opencv-python==4.11.0.86",
    "pyrealsense2==2.53.1.4623",
    "pyzmq==26.3.0",
    "scipy==1.15.2",
    "sortedcontainers==2.4.0",
]

# Add this section for editable installs
[tool.setuptools.dynamic]
version = {attr = "tag_pose_estimation.__version__"}

[tool.hatch.build.targets.wheel]
packages = ["tag_pose_estimation"]

[tool.hatch.build]
only-packages = true
